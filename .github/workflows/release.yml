# Builds fs for every platform and publishes a GitHub release when a version
# tag (v1.0.0, v1.1.0, ...) is pushed. Release notes come from
# releases/<tag>.md if that file exists.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X fs/internal/version.Version=${GITHUB_REF_NAME}" \
              -o "dist/fs-${GITHUB_REF_NAME}-${os}-${arch}${ext}" .
          done
          cd dist && sha256sum * > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "fs ${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "fs ${GITHUB_REF_NAME}" --generate-notes
          fi
