<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>{{.Status}} {{.Title}}</title>
<style nonce="{{.Nonce}}">{{.CSS}}</style>
</head>
<body>
<main class="error">
<p class="code">{{.Status}}</p>
<h1>{{.Title}}</h1>
{{- if .Message}}
<p>{{.Message}}</p>
{{- end}}
<p><a href="/">Back to the home folder</a></p>
</main>
<footer class="foot">
<span></span>
<span>Served by fs</span>
</footer>
</body>
</html>
